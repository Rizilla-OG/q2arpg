// q2rpg default binds
bind 1 "slot 1"
bind 2 "slot 2"
bind 3 "slot 3"
bind 4 "slot 4"
bind r "reload"
bind e "loot_take"
bind g "loot_drop"
bind i "loot_inv"
bind 5 "slot 5"
bind 6 "slot 6"
bind 7 "slot 7"
bind 8 "slot 8"
bind 9 "slot 9"
bind k "skills"
bind f "action"
bind x "loot_sell"
bind b "loot_stash"
bind v "vendor"
bind j "challenges"
bind q "grenade"
// hold-to-zoom: the engine does not forward +/- commands, so alias them to plain ones
alias +loot_zoom "cmd zoom_on"
alias -loot_zoom "cmd zoom_off"
bind mouse2 "+loot_zoom"
// controller (split-screen coop); A jump, LS click crouch, RT fire, RB weapon wheel, dpad L/R weapon prev/next stay stock
bind X_BUTTON "reload"
bind Y_BUTTON "loot_take"
bind B_BUTTON "loot_sell"
bind LEFT_TRIGGER "+loot_zoom"
bind LEFT_SHOULDER "action"
bind DPAD_UP "loot_inv"
bind DPAD_DOWN "vendor"
bind VIEW_BUTTON "skills"
bind RIGHT_STICK "grenade"
